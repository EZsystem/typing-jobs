      "typing_candidates": [
        "deprecated"
      ],
      "meaning": "非推奨の",
      "katakana": "デプリケーテッド",
      "ipa": "/ˈdɛp.rə.keɪ.tɪd/",
      "chapter": "ch13",
      "category": "ログによく表われる単語",
      "source": "programming_book_toc_150"
    },
    {
      "no": 150,
      "id": "halt",
      "word": "halt",
      "toc_display": "halt",
      "typing_candidates": [
        "halt"
      ],
      "meaning": "停止・休止する",
      "katakana": "ホールト",
      "ipa": "/hɔːlt/",
      "chapter": "ch13",
      "category": "ログによく表われる単語",
      "source": "programming_book_toc_150"
    }
  ]
};

    // --- 実行状態管理 ---
    let wordsMap = {};
    let currentQueue = [];
    let currentIndex = 0;
    let preferredVoice = null;
    let engineWarmed = false;
    let speakToken = 0;
    let loadDelayTimer = null;
    let nextSentenceTimer = null;
    let candidateTimeoutTimer = null;
    let isTransitioning = false;
    let wordHasLoggedMiss = false;
    let isNumericalSession = false;
    let lastLessonLogged = null;

    // DOM要素
    const lessonSelect = document.getElementById('lesson-select');
    const speedSelect = document.getElementById('speed-select');
    const lessonBadge = document.getElementById('lesson-badge');
    const meaningDisplay = document.getElementById('meaning-display');
    const katakanaDisplay = document.getElementById('katakana-display');
    const ipaDisplay = document.getElementById('ipa-display');
    const wordDisplay = document.getElementById('word-display');
    const inputArea = document.getElementById('input-area');
    const statusDisplay = document.getElementById('status');
    const progressFill = document.getElementById('progress-fill');
    const startBtn = document.getElementById('start-btn');
    const logBox = document.getElementById('log-box');

    // ログ出力関数
    function logEvent(type, message) {
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.${String(now.getMilliseconds()).padStart(3, '0')}`;
        const line = document.createElement('div');
        
        let color = '#d4d4d4';
        if (type === 'SUCCESS') color = '#4ec9b0';
        else if (type === 'AUDIO') color = '#ce9178';
        else if (type === 'WARN') color = '#dcdcaa';
        else if (type === 'ERROR') color = '#f44747';
        else if (type === 'COMPLETE') color = '#9cdcfe';
        
        line.innerHTML = `<span style="color:#888;">[${timeStr}]</span> <span style="color:${color};font-weight:bold;">[${type}]</span> ${escapeHtml(message)}`;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, m => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        }[m]));
    }

    function clearLogs() {
        logBox.innerHTML = '';
        logEvent('INFO', 'ログをクリアしました。');
    }

    function copyLogs() {
        const text = logBox.innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('ログをクリップボードにコピーしました。');
        }).catch(err => {
            console.error('Copy failed:', err);
        });
    }

    function toggleLogView() {
        logBox.style.display = (logBox.style.display === 'none') ? 'block' : 'none';
    }

    // レッスンセレクトの初期化
    function initLessonSelect() {
        const currentVal = lessonSelect.value;
        lessonSelect.innerHTML = '<option value="all">★ 全語を通して実行 (All 150 Words)</option>';
        LESSON_DEFINITIONS.forEach((lesson, index) => {
            const opt = document.createElement('option');
            opt.value = String(index);
            opt.textContent = `${lesson.title} (${lesson.wordCount || lesson.wordIds.length}語)`;
            lessonSelect.appendChild(opt);
        });
        if (currentVal) lessonSelect.value = currentVal;
    }

    // 単語データのマッピング
    function loadWordsData(data) {
        wordsMap = {};
        if (data.words && Array.isArray(data.words)) {
            data.words.forEach(w => {
                wordsMap[w.id] = w;
            });
        }
        if (data.lessons && Array.isArray(data.lessons)) {
            LESSON_DEFINITIONS = data.lessons;
        }
    }

    // 外部 JSON 読み込み (HTTP 環境) + 内蔵フォールバック
    async function initData() {
        loadWordsData(DEFAULT_WORDS_DATA);
        initLessonSelect();
        logEvent('INFO', `内蔵フォールバックデータを読み込みました (全${Object.keys(wordsMap).length}語)`);

        try {
            const res = await fetch('data/words_programming_150.json', { cache: 'no-cache' });
            if (res.ok) {
                const extData = await res.json();
                let updated = false;
                if (extData.words && Array.isArray(extData.words)) {
                    extData.words.forEach(w => {
                        wordsMap[w.id] = w;
                    });
                    updated = true;
                }
                if (extData.lessons && Array.isArray(extData.lessons)) {
                    LESSON_DEFINITIONS = extData.lessons;
                    initLessonSelect();
                }
                if (updated) {
                    logEvent('SUCCESS', `外部 data/words_programming_150.json を読み込みました (全${Object.keys(wordsMap).length}語, version:${extData.version || 1})`);
                }
            } else {
                logEvent('INFO', `data/words_programming_150.json 応答ステータス: ${res.status} (内蔵データで継続)`);
            }
        } catch (e) {
            logEvent('INFO', 'file:// プロトコルまたはローカル制限を検知。内蔵データで正常に動作します。');
        }
    }

    // 音声初期化
    function selectEnglishVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        return (
            voices.find(v => v.lang === 'en-US' && /natural|premium|enhanced/i.test(v.name)) ||
            voices.find(v => v.lang === 'en-US' && /google|samantha|zira|david/i.test(v.name)) ||
            voices.find(v => v.lang === 'en-US') ||
            voices.find(v => v.lang && v.lang.startsWith('en')) ||
            null
        );
    }

    function applyVoice(uttr) {
        if (!preferredVoice) preferredVoice = selectEnglishVoice();
        if (preferredVoice) {
            uttr.voice = preferredVoice;
            uttr.lang = preferredVoice.lang;
        }
    }

    function runUtterance(uttr) {
        return new Promise((resolve, reject) => {
            let settled = false;
            const finish = (fn, arg) => {
                if (settled) return;
                settled = true;
                fn(arg);
            };
            uttr.onend = () => finish(resolve);
            uttr.onerror = (e) => finish(reject, e);
            speechSynthesis.speak(uttr);
            setTimeout(() => finish(resolve), 1200);
        });
    }

    async function warmEngine() {
        if (engineWarmed) return;
        if (speechSynthesis.paused) speechSynthesis.resume();
        const warm = new SpeechSynthesisUtterance('ready');
        warm.volume = 0.01;
        warm.rate = 1.2;
        applyVoice(warm);
        try {
            await runUtterance(warm);
            engineWarmed = true;
            logEvent('INFO', '音声エンジン初期化完了 (Speech Engine Warmed)');
        } catch (e) {
            engineWarmed = true;
            logEvent('WARN', '音声エンジン初期化タイムアウト（タイピング練習は継続可能）');
        }
    }

    if ('speechSynthesis' in window) {
        speechSynthesis.onvoiceschanged = () => {
            preferredVoice = selectEnglishVoice();
            if (preferredVoice) {
                logEvent('INFO', `英語音声を検出: ${preferredVoice.name} (${preferredVoice.lang})`);
            }
        };
    }

    // 単語キューの構築
    function buildQueue() {
        const mode = lessonSelect.value;
        const queue = [];

        if (mode === 'all') {
            isNumericalSession = false;
            let totalWords = 0;
            LESSON_DEFINITIONS.forEach(l => totalWords += l.wordIds.length);
            
            LESSON_DEFINITIONS.forEach((lesson) => {
                lesson.wordIds.forEach((wid, wIdx) => {
                    const wData = wordsMap[wid];
                    if (wData) {
                        queue.push({
                            ...wData,
                            lessonTitle: lesson.title,
                            wordIndexInLesson: wIdx + 1,
                            wordTotalInLesson: lesson.wordIds.length
                        });
                    }
                });
            });
        } else {
            isNumericalSession = true;
            const startIndex = parseInt(mode, 10);
            for (let i = startIndex; i < LESSON_DEFINITIONS.length; i++) {
                const lesson = LESSON_DEFINITIONS[i];
                lesson.wordIds.forEach((wid, wIdx) => {
                    const wData = wordsMap[wid];
                    if (wData) {
                        queue.push({
                            ...wData,
                            lessonTitle: lesson.title,
                            lessonIndex: i,
                            wordIndexInLesson: wIdx + 1,
                            wordTotalInLesson: lesson.wordIds.length
                        });
                    }
                });
            }
        }
        return queue;
    }

    // 練習開始
    async function startPractice() {
        if (candidateTimeoutTimer) {
            clearTimeout(candidateTimeoutTimer);
            candidateTimeoutTimer = null;
        }
        if (nextSentenceTimer) {
            clearTimeout(nextSentenceTimer);
            nextSentenceTimer = null;
        }
        currentQueue = buildQueue();
        currentIndex = 0;
        lastLessonLogged = null;

        if (currentQueue.length === 0) {
            alert('単語データが見つかりませんでした。');
            return;
        }

        logEvent('INFO', `練習セッション開始: 全${currentQueue.length}語のキューを生成`);
        inputArea.disabled = false;
        startBtn.innerText = 'リスタート (Restart)';
        updateProgress();
        statusDisplay.innerText = 'Preparing audio...';
        await warmEngine();
        inputArea.focus();
        loadWord();
    }

    // 単語の読み込み表示
    function loadWord() {
        isTransitioning = false;
        wordHasLoggedMiss = false;
        if (candidateTimeoutTimer) {
            clearTimeout(candidateTimeoutTimer);
            candidateTimeoutTimer = null;
        }

        if (currentIndex >= currentQueue.length) {
            meaningDisplay.innerText = '🎉 全150語達成！すべての練習が終了しました';
            katakanaDisplay.innerText = '';
            ipaDisplay.innerText = '';
            wordDisplay.innerText = 'Congratulations! All 150 Words Finished.';
            if (lessonBadge) lessonBadge.innerText = '';
            inputArea.disabled = true;
            statusDisplay.innerText = 'レッスンを選択して再度スタートしてください。';
            statusDisplay.className = '';
            progressFill.style.width = '100%';
            logEvent('COMPLETE', `🎉 全単語達成！すべての練習が終了しました (全${currentQueue.length}語 完了)`);
            return;
        }

        const current = currentQueue[currentIndex];
        if (lessonBadge && current.lessonTitle) {
            lessonBadge.innerText = `${current.lessonTitle} （単語 ${current.wordIndexInLesson}/${current.wordTotalInLesson} · 全体 ${currentIndex + 1}/${currentQueue.length}）`;
        }
        if (current.lessonTitle && current.lessonTitle !== lastLessonLogged) {
            lastLessonLogged = current.lessonTitle;
            logEvent('INFO', `▶ 【章進行】「${current.lessonTitle}」に入りました (章内全${current.wordTotalInLesson}語)`);
            if (isNumericalSession && current.lessonIndex !== undefined) {
                lessonSelect.value = String(current.lessonIndex);
            }
        }

        meaningDisplay.innerText = current.meaning;
        katakanaDisplay.innerText = current.katakana;
        ipaDisplay.innerText = current.ipa;

        renderEnglishText('');

        statusDisplay.innerText = 'Listening... (読み上げ中)';
        statusDisplay.className = '';
        inputArea.value = '';
        updateProgress();
        logEvent('INFO', `[${currentIndex + 1}/${currentQueue.length}] 出題: "${current.toc_display || current.word}" (${current.meaning})`);

        if (loadDelayTimer) {
            clearTimeout(loadDelayTimer);
            loadDelayTimer = null;
        }
        const tokenAtLoad = speakToken;
        loadDelayTimer = setTimeout(() => {
            loadDelayTimer = null;
            if (tokenAtLoad !== speakToken) return;
            speak(current.toc_display || current.word);
        }, 300);
    }

    // 単語の最良一致候補判定
    function getBestTarget(item, userInput) {
        const cands = item.typing_candidates && item.typing_candidates.length > 0 ? item.typing_candidates : [item.word];
        const display = item.toc_display || item.word;
        const noCommaDisplay = display.replace(/,/g, '');
        if (!userInput) return display;
        
        // カンマあり表示に一致
        if (display.toLowerCase().startsWith(userInput.toLowerCase())) {
            return display;
        }
        // カンマなし表示に一致
        if (noCommaDisplay.toLowerCase().startsWith(userInput.toLowerCase())) {
            return noCommaDisplay;
        }
        // 個別候補の前方一致
        for (const c of cands) {
            if (c.toLowerCase().startsWith(userInput.toLowerCase())) {
                return c;
            }
        }
        // 入力が候補で始まっている場合
        for (const c of cands) {
            if (userInput.toLowerCase().startsWith(c.toLowerCase())) {
                return c;
            }
        }
        return display;
    }

    // 単語（文字単位）の描画
    function renderEnglishText(userInput) {
        if (!currentQueue[currentIndex]) return;
        const currentItem = currentQueue[currentIndex];
        const targetText = getBestTarget(currentItem, userInput);

        let html = '';
        for (let i = 0; i < targetText.length; i++) {
            const char = targetText[i];
            const isSpace = char === ' ';

            if (i < userInput.length) {
                if (userInput[i].toLowerCase() === char.toLowerCase()) {
                    if (isSpace) {
                        html += `<span class="char-correct space-correct">&nbsp;</span>`;
                    } else {
                        html += `<span class="char-correct">${escapeHtml(char)}</span>`;
                    }
                } else {
                    if (isSpace) {
                        html += `<span class="char-wrong space-wrong">&nbsp;</span>`;
                    } else {
                        html += `<span class="char-wrong">${escapeHtml(char)}</span>`;
                    }
                }
            } else {
                if (isSpace) {
                    html += `<span class="char-pending space-char">&nbsp;</span>`;
                } else {
                    html += `<span class="char-pending">${escapeHtml(char)}</span>`;
                }
            }
        }
        wordDisplay.innerHTML = html;
    }

    // 音声読み上げ
    async function speak(text) {
        const token = ++speakToken;

        if (speechSynthesis.speaking || speechSynthesis.pending) {
            speechSynthesis.cancel();
            await waitMs(250);
        } else if (speechSynthesis.paused) {
            speechSynthesis.resume();
        }
        if (token !== speakToken) return;

        await warmEngine();
        if (token !== speakToken) return;

        const rate = parseFloat(speedSelect.value) || 0.7;
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.rate = rate;
        uttr.pitch = 1.0;
        applyVoice(uttr);

        const timeoutMs = Math.max(6000, Math.ceil((text.length * 150) / rate));
        logEvent('AUDIO', `音声読み上げ開始 (速度: ${rate}): "${text}"`);
        statusDisplay.innerText = 'Listening... (読み上げ中)';
        statusDisplay.className = '';

        try {
            await new Promise((resolve, reject) => {
                let settled = false;
                const timer = setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    logEvent('WARN', `音声タイムアウト保護発動 (${timeoutMs}ms) → 入力待機 (Type it!) に復帰`);
                    speechSynthesis.cancel();
                    resolve();
                }, timeoutMs);

                uttr.onend = () => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    resolve();
                };
                uttr.onerror = (e) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    logEvent('WARN', `音声合成エラーイベント: ${e.error || 'unknown'}`);
                    resolve();
                };

                speechSynthesis.speak(uttr);
            });

            if (token !== speakToken) return;
            statusDisplay.innerText = 'Type it!';
            statusDisplay.className = '';
            inputArea.focus();
        } catch (e) {
            console.error('Speech synthesis error:', e);
            if (token !== speakToken) return;
            speechSynthesis.cancel();
            statusDisplay.innerText = 'Type it! (Enter で再読み上げ)';
            statusDisplay.className = '';
            logEvent('WARN', '音声キャンセル → Enterキーで再読み上げ可能');
            inputArea.focus();
        }
    }

    function replayCurrentVoice() {
        if (!currentQueue[currentIndex]) return;
        const current = currentQueue[currentIndex];
        speak(current.toc_display || current.word);
    }

    function waitMs(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    function updateProgress() {
        const percent = (currentIndex / currentQueue.length) * 100;
        progressFill.style.width = percent + '%';
    }

    // 正解完了時の処理
    function handleCorrectMatch(matchedWord, matchType = 'full') {
        if (isTransitioning) return;
        isTransitioning = true;

        const currentItem = currentQueue[currentIndex];
        const isEndOfLesson = currentItem && (currentItem.wordIndexInLesson === currentItem.wordTotalInLesson) && (currentIndex + 1 < currentQueue.length);

        if (candidateTimeoutTimer) {
            clearTimeout(candidateTimeoutTimer);
            candidateTimeoutTimer = null;
        }

        // 次語へのキー漏洩防止のため即座にクリア・無効化
        inputArea.value = '';
        inputArea.disabled = true;

        if (nextSentenceTimer) {
            clearTimeout(nextSentenceTimer);
            nextSentenceTimer = null;
        }

        const matchKind = matchType === 'short_tab' ? ' (短縮形Tabスキップ)' : (matchType === 'full' ? ' (全文一致)' : ` (${matchType})`);

        if (isEndOfLesson) {
            const nextItem = currentQueue[currentIndex + 1];
            const nextLessonName = nextItem ? nextItem.lessonTitle : '次の章';
            statusDisplay.innerText = `🎉 ${currentItem.lessonTitle} クリア！ → ${nextLessonName} へ進みます`;
            statusDisplay.className = 'correct';
            logEvent('SUCCESS', `🎉 【章クリア】「${currentItem.lessonTitle}」完了！ 次の章へ進みます (1200ms後)`);
            nextSentenceTimer = setTimeout(() => {
                nextSentenceTimer = null;
                currentIndex++;
                statusDisplay.className = '';
                loadWord();
                inputArea.disabled = false;
                inputArea.focus();
            }, 1200);
        } else {
            statusDisplay.innerText = 'Correct! Next...';
            statusDisplay.className = 'correct';
            logEvent('SUCCESS', `正解！ [${currentIndex + 1}/${currentQueue.length}] "${matchedWord}"${matchKind} → 次へ (600ms後)`);
            nextSentenceTimer = setTimeout(() => {
                nextSentenceTimer = null;
                currentIndex++;
                statusDisplay.className = '';
                loadWord();
                inputArea.disabled = false;
                inputArea.focus();
            }, 600);
        }
    }

    // 入力監視リスナー
    inputArea.addEventListener('input', () => {
        if (isTransitioning || !currentQueue[currentIndex]) {
            if (isTransitioning) inputArea.value = '';
            return;
        }

        const currentItem = currentQueue[currentIndex];
        const userInput = inputArea.value;
        const cands = currentItem.typing_candidates && currentItem.typing_candidates.length > 0 ? currentItem.typing_candidates : [currentItem.word];
        const displayWord = currentItem.toc_display || currentItem.word;
        const isCompound = displayWord.includes(',') || cands.length > 1;

        renderEnglishText(userInput);

        if (candidateTimeoutTimer) {
            clearTimeout(candidateTimeoutTimer);
            candidateTimeoutTimer = null;
        }

        // 判定対象:
        // 略語併記等の連なり出題（def, define 等）では、表示形（カンマあり "def, define" / カンマなし "def define"）の完全一致のみを主ゴールとする。
        // 単一語（import 等）の場合は cands / displayWord。
        const acceptedTargets = isCompound
            ? [displayWord, displayWord.replace(/,/g, '')]
            : [...cands, displayWord];

        // 1. 完全一致チェック
        const exactMatch = acceptedTargets.find(t => t.toLowerCase() === userInput.trim().toLowerCase());
        if (exactMatch) {
            handleCorrectMatch(exactMatch, 'full');
            return;
        }

        // 2. 前方一致チェック
        // 連なり出題では acceptedTargets への前方一致を優先し、さらに短縮形Tabスキップを狙う入力も考慮
        const prefixTargets = isCompound ? [...acceptedTargets, ...cands] : acceptedTargets;
        const hasPrefix = prefixTargets.some(t => t.toLowerCase().startsWith(userInput.toLowerCase()));
        if (hasPrefix) {
            if (isCompound && cands.some(c => c.toLowerCase() === userInput.trim().toLowerCase())) {
                statusDisplay.innerText = 'Typing... (最後まで入力、または Tab で短縮確定)';
            } else {
                statusDisplay.innerText = 'Typing...';
            }
            statusDisplay.className = '';
        } else {
            statusDisplay.innerText = 'Oops! 綴りを確認してください';
            statusDisplay.className = 'incorrect';
            if (!wordHasLoggedMiss) {
                wordHasLoggedMiss = true;
                logEvent('WARN', `ミスタイプ検知: 入力="${userInput}" 目標="${displayWord}"`);
            }
        }
    });

    // Enter / Space / Tab キー操作補助
    inputArea.addEventListener('keydown', (e) => {
        if (isTransitioning || !currentQueue[currentIndex]) {
            if (isTransitioning) e.preventDefault();
            return;
        }
        const currentItem = currentQueue[currentIndex];
        const userInput = inputArea.value.trim();
        const cands = currentItem.typing_candidates && currentItem.typing_candidates.length > 0 ? currentItem.typing_candidates : [currentItem.word];
        const displayWord = currentItem.toc_display || currentItem.word;
        const isCompound = displayWord.includes(',') || cands.length > 1;

        if (e.key === 'Tab') {
            // 方針B: 略語併記等の連なり出題で、短縮形入力後に明示的に Tab キーを押した場合は即確定スキップ
            if (isCompound && userInput) {
                const shortMatch = cands.find(c => c.toLowerCase() === userInput.toLowerCase());
                if (shortMatch) {
                    e.preventDefault();
                    handleCorrectMatch(shortMatch, 'short_tab');
                    return;
                }
            }
        } else if (e.key === 'Enter') {
            if (!userInput) {
                // 未入力Enter時は音声再再生
                e.preventDefault();
                replayCurrentVoice();
                return;
            }
            const acceptedTargets = isCompound
                ? [displayWord, displayWord.replace(/,/g, '')]
                : [...cands, displayWord];
            const match = acceptedTargets.find(t => t.toLowerCase() === userInput.toLowerCase());
            if (match) {
                e.preventDefault();
                handleCorrectMatch(match, 'enter');
                return;
            }
        } else if (e.key === ' ') {
            // 単一語出題のみ、末尾スペースでの完全一致確定を許可（連なり出題では単語間スペースを入力するため確定させない）
            if (!isCompound && userInput) {
                const match = cands.find(t => t.toLowerCase() === userInput.toLowerCase());
                if (match) {
                    e.preventDefault();
                    handleCorrectMatch(match, 'space');
                    return;
                }
            }
        }
    });

    // 速度変更監視
    speedSelect.addEventListener('change', () => {
        logEvent('INFO', `読み上げ速度を ${speedSelect.value} に変更しました`);
    });

    // アプリケーション起動
    initData();
</script>
