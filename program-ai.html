    .char-wrong { color: #dc3545; background-color: #f8d7da; border-radius: 3px; padding: 0 1px; }

    // アプリ内状態
    let wordsMap = {};
    let currentQueue = [];
    let currentIndex = 0;
    let preferredVoice = null;
    let engineWarmed = false;
    let speakToken = 0;
    let nextSentenceTimer = null;
    let loadDelayTimer = null;
    let isNumericalSession = false;
    let lastLessonLogged = '';
    let wordHasLoggedMiss = false;

    // DOM要素
    const lessonSelect = document.getElementById('lesson-select');
    const speedSelect = document.getElementById('speed-select');
    const lessonBadge = document.getElementById('lesson-badge');
    const meaningDisplay = document.getElementById('meaning-display');
    const katakanaDisplay = document.getElementById('katakana-display');
    const ipaDisplay = document.getElementById('ipa-display');
    const wordDisplay = document.getElementById('word-display');
    const inputArea = document.getElementById('input-area');
    const progressFill = document.getElementById('progress-fill');
    const statusDisplay = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const logBox = document.getElementById('log-box');

    // ログ出力関数
    function logEvent(type, message) {
        const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
        const line = document.createElement('div');
        let color = '#d4d4d4';
        if (type === 'SUCCESS') color = '#4ec9b0';
        else if (type === 'WARN') color = '#ce9178';
        else if (type === 'ERROR') color = '#f14c4c';
        else if (type === 'INFO') color = '#9cdcfe';
        else if (type === 'AUDIO') color = '#dcdcaa';
        else if (type === 'START' || type === 'COMPLETE') color = '#c586c0';
        line.innerHTML = `<span style="color:#858585;">[${time}]</span> <span style="color:${color}; font-weight:bold;">[${type}]</span> ${message}`;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function copyLogPanel() {
        const text = logBox.innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('ログをクリップボードにコピーしました');
        }).catch(() => {
            alert('コピーに失敗しました');
        });
    }

    function toggleLogPanel() {
        const isHidden = logBox.style.display === 'none';
        logBox.style.display = isHidden ? 'block' : 'none';
        document.getElementById('toggle-log-btn').innerText = isHidden ? 'ログを隠す' : 'ログを表示';
    }

    function clearLogPanel() {
        logBox.innerHTML = '';
        logEvent('INFO', 'ログを消去しました');
    }

    function waitMs(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 単語マップの構築
    function buildWordsMap(wordsList) {
        const map = {};
        wordsList.forEach(w => {
            if (w && w.id) {
                map[w.id] = w;
            }
        });
        return map;
    }

    // レッスンセレクトの初期化
    function initLessonSelect() {
        // option[0]「★ 全語を通して実行」以外を一旦クリア
        while (lessonSelect.options.length > 1) {
            lessonSelect.remove(1);
        }
        LESSON_DEFINITIONS.forEach((lesson, idx) => {
            const opt = document.createElement('option');
            opt.value = String(idx);
            opt.text = `${lesson.title} (${lesson.wordIds.length}語)`;
            lessonSelect.appendChild(opt);
        });
    }

    // データ初期化 (内蔵データをまず展開し、fetch可能なら外部 data/words_programming_ai.json を取得)
    async function initData() {
        // 1. まず内蔵データで構築
        wordsMap = buildWordsMap(DEFAULT_WORDS_DATA.words);
        logEvent('INFO', `内蔵フォールバックデータを読み込みました (${Object.keys(wordsMap).length}語)`);

        // 2. 外部 data/words_programming_ai.json を fetch 試行
        try {
            const res = await fetch('data/words_programming_ai.json', { cache: 'no-store' });
            if (res.ok) {
                const extData = await res.json();
                let updated = false;
                if (extData && Array.isArray(extData.words) && extData.words.length > 0) {
                    wordsMap = buildWordsMap(extData.words);
                    updated = true;
                }
                if (extData && Array.isArray(extData.lessons) && extData.lessons.length > 0) {
                    LESSON_DEFINITIONS = extData.lessons;
                    initLessonSelect();
                }
                if (updated) {
                    logEvent('SUCCESS', `外部 data/words_programming_ai.json を読み込みました (全${Object.keys(wordsMap).length}語, version:${extData.version || 1})`);
                }
            } else {
                logEvent('INFO', `data/words_programming_ai.json 応答ステータス: ${res.status} (内蔵データで継続)`);
            }
        } catch (e) {
            // file:// プロトコルなどの制約
            logEvent('INFO', 'file:// プロトコルまたはローカル制限を検知。内蔵データで正常に動作します。');
        }
    }

    // 音声初期化 (Jobs 実績コードを踏襲)
    function selectEnglishVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        return (
            voices.find(v => v.lang === 'en-US' && /natural|premium|enhanced/i.test(v.name)) ||
            voices.find(v => v.lang === 'en-US' && /google|samantha|zira|david/i.test(v.name)) ||
            voices.find(v => v.lang === 'en-US') ||
            voices.find(v => v.lang && v.lang.startsWith('en')) ||
            null
        );
    }

    function applyVoice(uttr) {
        if (!preferredVoice) preferredVoice = selectEnglishVoice();
        if (preferredVoice) {
            uttr.voice = preferredVoice;
            uttr.lang = preferredVoice.lang;
        }
    }

    function runUtterance(uttr) {
        return new Promise((resolve, reject) => {
            let settled = false;
            const finish = (fn, arg) => {
                if (settled) return;
                settled = true;
                fn(arg);
            };
            uttr.onend = () => finish(resolve);
            uttr.onerror = (e) => finish(reject, e);
            speechSynthesis.speak(uttr);
            setTimeout(() => finish(resolve), 1200);
        });
    }

    async function warmEngine() {
        if (engineWarmed) return;
        if (speechSynthesis.paused) speechSynthesis.resume();
        const warm = new SpeechSynthesisUtterance('ready');
        warm.volume = 0.01;
        warm.rate = 1.2;
        applyVoice(warm);
        try {
            await runUtterance(warm);
        } catch (e) {}
        engineWarmed = true;
    }

    function getLessonTitle(idx) {
        const lesson = LESSON_DEFINITIONS[idx];
        return lesson ? lesson.title : `レッスン ${idx + 1}`;
    }

    // 練習開始
    async function startPractice() {
        speakToken++;
        if (nextSentenceTimer) {
            clearTimeout(nextSentenceTimer);
            nextSentenceTimer = null;
        }
        if (loadDelayTimer) {
            clearTimeout(loadDelayTimer);
            loadDelayTimer = null;
        }
        if (speechSynthesis.speaking || speechSynthesis.pending || speechSynthesis.paused) {
            speechSynthesis.cancel();
        }

        const selectedValue = lessonSelect.value;
        currentQueue = [];
        lastLessonLogged = '';

        if (selectedValue === 'all') {
            isNumericalSession = false;
            LESSON_DEFINITIONS.forEach((lesson, lIdx) => {
                const title = lesson.title;
                lesson.wordIds.forEach((wid, wIdx) => {
                    const wItem = wordsMap[wid];
                    if (wItem) {
                        currentQueue.push({
                            id: wid,
                            word: wItem.word,
                            meaning: wItem.meaning,
                            ipa: wItem.ipa,
                            katakana: wItem.katakana,
                            lessonTitle: title,
                            lessonIndex: lIdx,
                            wordIndexInLesson: wIdx + 1,
                            wordTotalInLesson: lesson.wordIds.length
                        });
                    }
                });
            });
            logEvent('START', `★ 全語を通して実行を開始 (全${currentQueue.length}語)`);
        } else {
            isNumericalSession = true;
            const startIndex = parseInt(selectedValue, 10);
            const startTitle = getLessonTitle(startIndex);
            // 選択したレッスンから最終レッスンまで継続実行
            for (let i = startIndex; i < LESSON_DEFINITIONS.length; i++) {
                const lesson = LESSON_DEFINITIONS[i];
                if (lesson) {
                    const title = lesson.title;
                    lesson.wordIds.forEach((wid, wIdx) => {
                        const wItem = wordsMap[wid];
                        if (wItem) {
                            currentQueue.push({
                                id: wid,
                                word: wItem.word,
                                meaning: wItem.meaning,
                                ipa: wItem.ipa,
                                katakana: wItem.katakana,
                                lessonTitle: title,
                                lessonIndex: i,
                                wordIndexInLesson: wIdx + 1,
                                wordTotalInLesson: lesson.wordIds.length
                            });
                        }
                    });
                }
            }
            logEvent('START', `【継続実行】「${startTitle}」〜 最終レッスンまで開始 (全${currentQueue.length}語)`);
        }

        if (currentQueue.length === 0) {
            logEvent('WARN', '単語データが0件のため開始できませんでした。');
            return;
        }

        currentIndex = 0;
        inputArea.disabled = false;
        inputArea.value = '';
        inputArea.focus();
        startBtn.innerText = 'リスタート (Restart)';
        updateProgress();
        statusDisplay.innerText = 'Preparing audio...';
        await warmEngine();
        inputArea.focus();
        loadWord();
    }

    // 単語の読み込み表示
    function loadWord() {
        wordHasLoggedMiss = false;

        if (currentIndex >= currentQueue.length) {
            meaningDisplay.innerText = '🎉 全単語達成！すべての練習が終了しました';
            katakanaDisplay.innerText = '';
            ipaDisplay.innerText = '';
            wordDisplay.innerText = 'Congratulations! All Finished.';
            if (lessonBadge) lessonBadge.innerText = '';
            inputArea.disabled = true;
            statusDisplay.innerText = 'レッスンを選択して再度スタートしてください。';
            statusDisplay.className = '';
            progressFill.style.width = '100%';
            logEvent('COMPLETE', `🎉 全単語達成！すべての練習が終了しました (全${currentQueue.length}語 完了)`);
            return;
        }

        const current = currentQueue[currentIndex];
        if (lessonBadge && current.lessonTitle) {
            lessonBadge.innerText = `${current.lessonTitle} （単語 ${current.wordIndexInLesson}/${current.wordTotalInLesson} · 全体 ${currentIndex + 1}/${currentQueue.length}）`;
        }
        if (current.lessonTitle && current.lessonTitle !== lastLessonLogged) {
            lastLessonLogged = current.lessonTitle;
            logEvent('INFO', `▶ 【レッスン進行】「${current.lessonTitle}」に入りました (レッスン内全${current.wordTotalInLesson}語)`);
            if (isNumericalSession && current.lessonIndex !== undefined) {
                lessonSelect.value = String(current.lessonIndex);
            }
        }

        meaningDisplay.innerText = current.meaning;
        katakanaDisplay.innerText = current.katakana;
        ipaDisplay.innerText = current.ipa;

        renderEnglishText('');

        statusDisplay.innerText = 'Listening... (読み上げ中)';
        statusDisplay.className = '';
        inputArea.value = '';
        updateProgress();
        logEvent('INFO', `[${currentIndex + 1}/${currentQueue.length}] 出題: "${current.word}" (${current.meaning})`);

        if (loadDelayTimer) {
            clearTimeout(loadDelayTimer);
            loadDelayTimer = null;
        }
        const tokenAtLoad = speakToken;
        loadDelayTimer = setTimeout(() => {
            loadDelayTimer = null;
            if (tokenAtLoad !== speakToken) return;
            speak(current.word);
        }, 300);
    }

    // 単語（文字単位）の描画
    function renderEnglishText(userInput) {
        if (!currentQueue[currentIndex]) return;
        const targetText = currentQueue[currentIndex].word;

        let html = '';
        for (let i = 0; i < targetText.length; i++) {
            const char = targetText[i];
            const isSpace = char === ' ';

            if (i < userInput.length) {
                if (userInput[i] === char) {
                    if (isSpace) {
                        html += `<span class="char-correct space-correct">&nbsp;</span>`;
                    } else {
                        html += `<span class="char-correct">${char}</span>`;
                    }
                } else {
                    if (isSpace) {
                        html += `<span class="char-wrong space-wrong">&nbsp;</span>`;
                    } else {
                        html += `<span class="char-wrong">${char}</span>`;
                    }
                }
            } else {
                if (isSpace) {
                    html += `<span class="char-pending space-char">&nbsp;</span>`;
                } else {
                    html += `<span class="char-pending">${char}</span>`;
                }
            }
        }
        wordDisplay.innerHTML = html;
    }

    // 音声読み上げ
    async function speak(text) {
        const token = ++speakToken;

        if (speechSynthesis.speaking || speechSynthesis.pending) {
            speechSynthesis.cancel();
            await waitMs(250);
        } else if (speechSynthesis.paused) {
            speechSynthesis.resume();
        }
        if (token !== speakToken) return;

        await warmEngine();
        if (token !== speakToken) return;

        const rate = parseFloat(speedSelect.value) || 1.0;
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.rate = rate;
        uttr.pitch = 1.0;
        applyVoice(uttr);

        const timeoutMs = Math.max(6000, Math.ceil((text.length * 150) / rate));
        logEvent('AUDIO', `音声読み上げ開始 (速度: ${rate}): "${text}"`);
        statusDisplay.innerText = 'Listening... (読み上げ中)';
        statusDisplay.className = '';

        try {
            await new Promise((resolve, reject) => {
                let settled = false;
                const timer = setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    logEvent('WARN', `音声タイムアウト保護発動 (${timeoutMs}ms) → 入力待機 (Type it!) に復帰`);
                    speechSynthesis.cancel();
                    resolve();
                }, timeoutMs);

                uttr.onend = () => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    logEvent('AUDIO', '音声読み上げ完了 → 入力待機 (Type it!)');
                    resolve();
                };
                uttr.onerror = (e) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    logEvent('ERROR', `音声合成エラー: ${e?.error || 'unknown'}`);
                    reject(e);
                };

                speechSynthesis.speak(uttr);
            });

            if (token !== speakToken) return;
            statusDisplay.innerText = 'Type it!';
            statusDisplay.className = '';
            inputArea.focus();
        } catch (e) {
            console.error('Speech synthesis error:', e);
            if (token !== speakToken) return;
            speechSynthesis.cancel();
            statusDisplay.innerText = 'Type it! (Enter で再読み上げ)';
            statusDisplay.className = '';
            logEvent('WARN', '音声キャンセル → Enterキーで再読み上げ可能');
            inputArea.focus();
        }
    }

    function updateProgress() {
        const percent = (currentIndex / currentQueue.length) * 100;
        progressFill.style.width = percent + '%';
    }

    // 入力監視リスナー
    inputArea.addEventListener('input', () => {
        if (!currentQueue[currentIndex]) return;

        const currentWord = currentQueue[currentIndex].word;
        const userInput = inputArea.value;

        renderEnglishText(userInput);

        if (userInput === currentWord) {
            const currentItem = currentQueue[currentIndex];
            const isEndOfLesson = currentItem && (currentItem.wordIndexInLesson === currentItem.wordTotalInLesson) && (currentIndex + 1 < currentQueue.length);

            inputArea.disabled = true;
            if (nextSentenceTimer) {
                clearTimeout(nextSentenceTimer);
                nextSentenceTimer = null;
            }

            if (isEndOfLesson) {
                const nextItem = currentQueue[currentIndex + 1];
                const nextLessonName = nextItem ? nextItem.lessonTitle : '次のレッスン';
                statusDisplay.innerText = `🎉 ${currentItem.lessonTitle} クリア！ → ${nextLessonName} へ進みます`;
                statusDisplay.className = 'correct';
                logEvent('SUCCESS', `🎉 【レッスンクリア】「${currentItem.lessonTitle}」完了！ 次のレッスンへ進みます (1200ms後)`);
                nextSentenceTimer = setTimeout(() => {
                    nextSentenceTimer = null;
                    currentIndex++;
                    inputArea.disabled = false;
                    inputArea.focus();
                    statusDisplay.className = '';
                    loadWord();
                }, 1200);
            } else {
                statusDisplay.innerText = 'Correct! Next...';
                statusDisplay.className = 'correct';
                logEvent('SUCCESS', `正解！ [${currentIndex + 1}/${currentQueue.length}] 次の単語へ進みます (600ms後)`);
                nextSentenceTimer = setTimeout(() => {
                    nextSentenceTimer = null;
                    currentIndex++;
                    inputArea.disabled = false;
                    inputArea.focus();
                    statusDisplay.className = '';
                    loadWord();
                }, 600);
            }
        } else if (currentWord.startsWith(userInput)) {
            statusDisplay.innerText = 'Typing...';
            statusDisplay.className = '';
        } else {
            statusDisplay.innerText = 'Miss!';
            statusDisplay.className = 'incorrect';
            if (!wordHasLoggedMiss) {
                wordHasLoggedMiss = true;
                const charExpected = currentWord[userInput.length - 1] || '';
                const charTyped = userInput[userInput.length - 1] || '';
                logEvent('WARN', `タイピング不一致: 入力='${charTyped}' (期待='${charExpected}')`);
            }
        }
    });

    inputArea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && inputArea.value === '') {
            speak(currentQueue[currentIndex].word);
        }
    });

    // 初期化実行
    window.addEventListener('DOMContentLoaded', async () => {
        initLessonSelect();
        await initData();
        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = () => {
                preferredVoice = selectEnglishVoice();
            };
            preferredVoice = selectEnglishVoice();
        }
        logEvent('INFO', 'プログラム／AI英単語タイピングの初期化が完了しました。レッスンを選んでスタートしてください。');
    });
</script>
